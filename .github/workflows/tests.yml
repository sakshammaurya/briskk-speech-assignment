name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API and test dependencies
        run: python -m pip install fastapi python-multipart "httpx>=0.27,<1.0" "pytest>=8,<9"
      - name: Run tests
        run: python -m pytest -q
